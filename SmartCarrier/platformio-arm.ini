[platformio]
src_dir = .
build_dir = .pio-arm/build
libdeps_dir = .pio-arm/libdeps

[env:arm_example]
platform = ststm32
platform_packages =
	tool-openocd@~2.1100.0
board = genericSTM32H750VB
framework = arduino
build_src_filter =
	-<*>
	+<examples/ARM.build.cpp>
lib_extra_dirs =
	AccelStepper-master
lib_deps =
	mathertel/OneButton@^2.6.1
upload_protocol = stlink
debug_tool = stlink
