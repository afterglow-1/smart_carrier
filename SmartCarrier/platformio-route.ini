[platformio]
src_dir = .
build_dir = .pio-route/build
libdeps_dir = .pio-route/libdeps

[env:carrier_route]
platform = ststm32
platform_packages =
	tool-openocd@~2.1100.0
board = genericSTM32H750VB
framework = arduino
build_src_filter =
	-<*>
	+<examples/CARRIER_ROUTE.build.cpp>
lib_extra_dirs =
	AccelStepper-master
lib_deps =
	mathertel/OneButton@^2.6.1
upload_protocol = cmsis-dap
debug_tool = cmsis-dap
monitor_port = COM10
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 1
