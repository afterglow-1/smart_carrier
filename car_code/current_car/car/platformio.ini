[env:genericSTM32H750VB]
platform = ststm32
board = genericSTM32H750VB
framework = arduino
upload_protocol = stlink
debug_port = stlink
lib_extra_dirs = ../../reference_code/final/lib
lib_deps =
	waspinator/AccelStepper@^1.64
	mathertel/OneButton@^2.6.1
