	waspinator/AccelStepper@^1.64
	mathertel/OneButton@^2.6.1
	mbed-sgrsn/JY901@0.0.0+sha.7e7dd6184774
	mbed-cat-bot/jy901@0.0.0+sha.a93909601341
debug_tool = stlink